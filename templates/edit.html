{% extends 'base.html' %}
{% load static %}
{% block content %}


    <div class="container m-auto">
        <div class="row">
            <div class="col-2">
            </div>
            <div class="col-8">
                <div class="row pt-3 pb-2 px-5">
                    <div class="border rounded-4">
                        <div class="row pt-3">
                            <div class="col-1 d-flex align-items-end justify-content-center">
                                <a href="javascript:history.back()">
                                    <i class="bi bi-arrow-left ps-1" style="font-size: 22px; color: dimgray;"></i>
                                </a>
                            </div>
                            <div class="col-11 d-flex flex-column mt-3">
                                <h2 class="text-start mb-0 fw-semibold">Edit Profile</h2>
                            </div>
                            <div class="px-5">
                                <hr/>
                            </div>
                        </div>
                        <div class="row">
                            <div class="row">
                            <div class="col-1"></div>
                            <div class="col-10">
                                <form method="post" action="{% url 'edit_profile' %}" enctype="multipart/form-data">
                                        {% csrf_token %}
                                        {{ user.as_p }}
                                        {{ profile.as_p }}
                                    <div class="row d-flex justify-content-between px-5 mx-5 my-4">
                                        <div class="col-2 d-flex align-items-center justify-content-center">
                                            <a href="javascript:history.back()" class="text-decoration-none mb-0" style="color: #436850">
                                                <p class="mb-0">
                                                Cancel
                                                </p>
                                            </a>
                                        </div>
                                        <div class="col-2 text-end">
                                            <a href="{% url 'edit_profile' %}">
                                            <button type="submit" class="btn text-light" style="background-color: #436850">Submit
                                            </button>
                                                </a>
                                        </div>
                                    </div>
                                </form>
                            </div>
                            <div class="col-1"></div>
                        </div>
                        </div>
                    </div>
                    <div class="col-2">
                    </div>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
